<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trumpagotchi</title>
  <meta name="description" content="A tremendous virtual pet. Feed him, flatter him, keep him glowing, and watch him become more and more himself. A parody." />
  <meta name="theme-color" content="#0c1630" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Trumpagotchi" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta property="og:title" content="Trumpagotchi" />
  <meta property="og:description" content="A tremendous virtual pet. The best pet. Everybody says so. (A parody.)" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="icons/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-hatched="0">
  <main class="app" id="app">
    <header class="top">
      <div class="brand">
        <h1 class="brand-name">TRUMPAGOTCHI</h1>
        <p class="brand-sub" id="stageLine">The Golden Egg</p>
      </div>
      <div class="top-right">
        <button class="cash" id="cashBtn" type="button" aria-label="Cash. Open the shop."><span id="cash">$0</span></button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu: trophies, orders, stats, settings">&#9776;</button>
      </div>
    </header>

    <section class="screen-wrap" aria-label="His office">
      <div class="screen" id="screen">
        <canvas id="scene" width="160" height="120" role="img" aria-label="Trumpagotchi"></canvas>
        <div class="chips" id="chips"></div>
        <div class="bubble" id="bubble" hidden><p id="bubbleText"></p></div>
        <div class="floats" id="floats" aria-hidden="true"></div>
        <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel" id="panel">
      <div class="intro" id="intro">
        <h2>A small loan, in egg form.</h2>
        <p>Tap the egg. Something tremendous is in there.</p>
        <button class="btn gold" id="hatchBtn" type="button">Tap the egg</button>
        <button class="btn ghost" id="linkBtn" type="button" hidden>I already have one on another device</button>
      </div>

      <div class="xp" id="xpBox">
        <div class="xp-head">
          <span class="lvl" id="lvl">LV 1</span>
          <span class="xp-label">Tremendousness</span>
          <span class="tier" id="tierName">Humble</span>
        </div>
        <div class="bar xp-bar" role="progressbar" aria-label="Tremendousness toward the next level" aria-valuemin="0" aria-valuemax="100" id="xpBar"><i id="xpFill"></i></div>
        <button class="btn gold run-again" id="runAgainBtn" type="button" hidden>Run for another term</button>
      </div>

      <div class="needs" id="needs"></div>
      <button class="ticker" id="ticker" type="button" aria-label="News about him. Opens his feed.">
        <span class="ticker-tag" aria-hidden="true">Breaking</span><span class="ticker-text" id="tickerText"></span>
      </button>
      <nav class="actions" id="actions" aria-label="Take care of him"></nav>
      <p class="foot">A parody. Not affiliated with, approved by, or tariffed by anyone.</p>

      <div class="sheet" id="sheet" hidden role="dialog" aria-modal="false" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <h2 id="sheetTitle"></h2>
          <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">&#10005;</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <p class="sr-only" id="sr" aria-live="polite"></p>

  <script src="js/content.js"></script>
  <script src="js/game.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
